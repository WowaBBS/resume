name: build-resume

on:
  push:
    branches: [main]
    paths:
      - 'resume/**'
      - 'resume-en/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx

      - name: LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer fonts-crosextra-carlito poppler-utils

      - name: Assemble docx and READMEs
        run: |
          python tools/build_resume.py resume --docx --readme "$PWD/README.ru.md" --lang ru --alt README.md
          python tools/build_resume.py resume-en --docx --readme "$PWD/README.md" --lang en --alt README.ru.md

      - name: Convert to PDF
        run: |
          soffice --headless --convert-to pdf --outdir build/resume build/resume/resume.docx
          soffice --headless --convert-to pdf --outdir build/resume-en build/resume-en/resume.docx
          cp build/resume/resume.pdf savin_vladimir_cv.pdf
          cp build/resume-en/resume.pdf savin_vladimir_cv_en.pdf
          cp build/resume/resume.docx savin_vladimir_cv.docx
          cp build/resume-en/resume.docx savin_vladimir_cv_en.docx

      - name: Check page count
        run: |
          set -eu
          ru=$(pdfinfo savin_vladimir_cv.pdf | awk '/^Pages:/ {print $2}')
          en=$(pdfinfo savin_vladimir_cv_en.pdf | awk '/^Pages:/ {print $2}')
          echo "ru=$ru en=$en"
          test "$ru" = "2" || { echo "::error::русское резюме не 2 страницы, а $ru"; exit 1; }
          test "$en" = "2" || { echo "::error::английское резюме не 2 страницы, а $en"; exit 1; }

      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ru.md savin_vladimir_cv.pdf savin_vladimir_cv_en.pdf savin_vladimir_cv.docx savin_vladimir_cv_en.docx
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "build: regenerate resume"
            git push
          fi
